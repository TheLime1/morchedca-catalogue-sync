name: Catalog sync

on:
  workflow_dispatch:
  schedule:
    # 04:37 UTC avoids the top-of-hour queue and major US/EU working hours.
    - cron: "37 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Build and fully validate catalog
        run: npm run build

      - name: Validate serialized CSV
        run: npm run validate

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
